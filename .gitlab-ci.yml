stages: [deploy]

deploy_production:
  stage: deploy
  tags: [deploy-vm]
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
  resource_group: production
  environment:
    name: production
    url: https://npm-mirror.fotros.dev
  variables:
    APP_NAME: npm-mirror
    APP_DIR: /srv/apps/npm-mirror
    APP_PORT: "5003"
  script:
    - node -v
    # Fail loudly: running without ENV_FILE is how production ended up on dev values.
    - if [ -z "${ENV_FILE:-}" ] || [ ! -f "$ENV_FILE" ]; then echo "ENV_FILE must be a GitLab File variable available to this job" >&2; exit 1; fi
    - pm2 delete "$APP_NAME" > /dev/null 2>&1 || true
    # /data/ = private packages (must be backed up) + public cache; /config.json = optional local config/tokens.
    - rsync -a --delete --exclude .git --exclude /data/ --exclude /config.json ./ "$APP_DIR"/
    - cd "$APP_DIR"
    # Clean environment for the long-running process: only PATH, HOME, PORT and the variables from
    # ENV_FILE. No CI_* job variables or tokens leak in (pm2 gives the app the env of `pm2 start`).
    - env -i PATH="$PATH" HOME="$HOME" sh -c 'set -a && . "$1" && export PORT="$2" && exec pm2 start src/main.js --name "$3" --cwd "$4"' sh "$ENV_FILE" "$APP_PORT" "$APP_NAME" "$APP_DIR"
    - pm2 save
    - for i in $(seq 1 30); do curl -sf -o /dev/null "http://127.0.0.1:$APP_PORT/-/ping" && exit 0; sleep 2; done; pm2 logs "$APP_NAME" --lines 50 --nostream; exit 1
